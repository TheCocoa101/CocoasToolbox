name: Release & Publish VPM Repository

on:
  push:
    branches:
      - main
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
    inputs:
      package:
        description: "Target package name (e.g. com.thecocoa101.armature-transfer) or 'all'"
        required: false
        default: "all"
      recreate:
        description: "Recreate existing GitHub Release if tag already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "vpm-release-pages"
  cancel-in-progress: false

jobs:
  release:
    name: Build & Create GitHub Releases
    runs-on: ubuntu-latest
    if: github.event_name != 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Release updated packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PACKAGE: ${{ inputs.package || 'all' }}
          RECREATE_RELEASE: ${{ inputs.recreate || false }}
        run: |
          set -euo pipefail
          ZIPS_DIR="${RUNNER_TEMP}/vpm-zips"
          mkdir -p "${ZIPS_DIR}"

          for pkg_dir in Packages/com.thecocoa101.*; do
            [ -d "${pkg_dir}" ] || continue
            [ -f "${pkg_dir}/package.json" ] || continue

            pkg_name=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["name"])' "${pkg_dir}/package.json")
            version=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "${pkg_dir}/package.json")
            tag="${pkg_name}-v${version}"

            if [ "${TARGET_PACKAGE}" != "all" ] && [ "${TARGET_PACKAGE}" != "${pkg_name}" ]; then
              continue
            fi

            if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              if [ "${RECREATE_RELEASE}" = "true" ]; then
                echo "Release ${tag} exists. Recreating release cleanly for current commit..."
                gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes || true
              else
                echo "Release ${tag} already exists. Skipping ${pkg_name}."
                continue
              fi
            fi

            echo "Building ${pkg_name} v${version}..."
            meta_json=$(python3 .github/scripts/build_zip.py --package "${pkg_dir}" --out-dir "${ZIPS_DIR}" --json)
            zip_path=$(python3 -c 'import json, sys; print(json.loads(sys.argv[1])["zip_path"])' "${meta_json}")
            display_name=$(python3 -c 'import json, sys; print(json.loads(sys.argv[1])["display_name"])' "${meta_json}")
            is_prerelease=$(python3 -c 'import json, sys; print("true" if json.loads(sys.argv[1])["prerelease"] else "false")' "${meta_json}")

            PRERELEASE_FLAG=""
            if [ "${is_prerelease}" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi

            gh release create "${tag}" "${zip_path}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${display_name} v${version}" \
              ${PRERELEASE_FLAG} \
              --generate-notes
          done

  pages:
    name: Update VPM Index & GitHub Pages
    runs-on: ubuntu-latest
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate VPM index.json & web page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/build_pages.py --output _site

      - name: Check GitHub Pages configuration
        id: pages_cfg
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Guide if GitHub Pages is not enabled yet
        if: steps.pages_cfg.outcome != 'success'
        run: |
          {
            echo "## ⚠️ GitHub Pages の初期設定が必要です（初回のみ）"
            echo ""
            echo "GitHub Release（VPM用 `.zip` ファイルとタグ）の作成は完了していますが、GitHub Pages がまだ有効化されていません。"
            echo ""
            echo "1. リポジトリ上部の **Settings** ＞ 左メニューの **Pages** を開く"
            echo "2. **Build and deployment** ＞ **Source** を **\`GitHub Actions\`** に変更する"
            echo "3. この Actions 画面に戻り、右上の **Re-run jobs** ＞ **Re-run failed jobs** を押す"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::GitHub Pages Source is not set to 'GitHub Actions' yet. Please enable it in Settings > Pages."
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
